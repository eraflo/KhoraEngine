name: Rust CI

on:
  push:
    branches: [ main ] # Run on pushes to main
  pull_request:
    branches: [ main ] # Run on PRs targeting main

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job in this workflow:
# all jobs only check out the repo and run cargo — no writes, no
# release/comment/status posting beyond the default check-run mechanism.
# Override per-job if a job ever needs more.
permissions:
  contents: read

jobs:
  lint_and_format:
    name: Format & Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Install Rust toolchain (with rustfmt and clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy # Ensure rustfmt and clippy are installed

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lint"

      - name: Check formatting
        # Check that all code in the workspace is correctly formatted
        run: cargo fmt --all -- --check

      - name: Run Clippy (Linter)
        # Run Clippy on the entire workspace, for all targets, with all features.
        # `-D warnings` turns Clippy warnings into errors.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build_and_test_ubuntu:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build
        # Build all targets in the workspace, with all features
        run: cargo build --verbose --workspace --all-targets --all-features

      - name: Run tests
        # Run tests using cargo-nextest for faster execution
        run: cargo nextest run --verbose --workspace --all-targets --all-features

  build_and_test_windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --verbose --workspace --all-targets --all-features

      - name: Run tests
        # Run tests using cargo-nextest for faster execution
        run: cargo nextest run --verbose --workspace --all-targets --all-features

  build_and_test_macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --verbose --workspace --all-targets --all-features

      - name: Run tests
        # Run tests using cargo-nextest for faster execution
        run: cargo nextest run --verbose --workspace --all-targets --all-features
  # cargo-nextest (used by the build_and_test_* jobs) does NOT run doctests,
  # so rustdoc examples would go unverified. This job runs them explicitly.
  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        # Pinned to the v0.0.9 commit SHA (supply-chain hygiene).
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Enable sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "doctests"

      - name: Run doctests
        # nextest can't run doctests; this is the only place they execute.
        # `--locked` matches the committed Cargo.lock used elsewhere.
        run: cargo test --workspace --doc --all-features --locked

  # Supply-chain / license / advisory gate driven by deny.toml at the repo
  # root. Vulnerabilities fail the build; unmaintained notices and duplicate
  # dependency versions only warn (see deny.toml for the rationale).
  cargo_deny:
    name: cargo-deny (advisories & licenses)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run cargo-deny
        # Pinned to the v2.0.9 commit SHA. The action bundles a matching
        # cargo-deny binary, so no separate toolchain/build is needed.
        uses: EmbarkStudios/cargo-deny-action@d6d27f1b02f0c07f9db6ffc34e7871bba5ab5816 # v2.0.9
        with:
          command: check

  # Enforces the workspace MSRV declared in [workspace.package] rust-version.
  # If a change starts using a newer stdlib/language feature, this fails until
  # the MSRV is bumped deliberately.
  msrv:
    name: MSRV (cargo check on 1.91)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Install MSRV toolchain (1.91)
        # Pinned to a commit SHA; the exact toolchain comes from `toolchain:`.
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.91"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv"

      - name: cargo check on MSRV
        run: cargo check --workspace --all-features --all-targets --locked

  # Report-only coverage. Produces an lcov.info artifact; it does NOT gate the
  # build (no threshold) and uses NO external service (no Codecov token).
  coverage:
    name: Coverage (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Install Rust toolchain (with llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"

      - name: Install cargo-llvm-cov
        # Pinned to the v2.81.10 commit SHA of taiki-e/install-action.
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        # Pinned to the v4.6.2 commit SHA.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  # This job ensures all required checks pass before allowing merge.
  # Coverage is intentionally excluded — it is report-only and non-blocking.
  all_checks_pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    needs: [lint_and_format, build_and_test_ubuntu, build_and_test_windows, build_and_test_macos, doctests, cargo_deny, msrv]
    steps:
      - name: Mark as successful
        run: echo "All required checks passed!"