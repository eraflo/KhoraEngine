<svg class="kp-figure" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kp-id-title kp-id-desc">
  <title id="kp-id-title">The 64 bits of a persistent id</title>
  <desc id="kp-id-desc">The top bit names the namespace. Zero: an authored entity, whose remaining 63 bits are random, chosen once and kept by every save. Also zero: a member of a prefab instance, whose bits are derived from the instance root's id and the member's id in the prefab, the same on every load and different for every instance. One: an entity created without an author, whose remaining bits are a number the world gives the first time something needs the entity's identity.</desc>
  <style>
    .kp-figure { width: 100%; height: auto; display: block; margin: 1.5rem 0; }
    .kp-bg { fill: var(--k-bg-0, #090d17); }
    .kp-cell { fill: var(--k-bg-3, #1f2636); }
    .kp-cell-soft { fill: var(--k-bg-2, #181e2b); }
    .kp-bit { fill: var(--k-bg-1, #101622); stroke: var(--k-silver-dim, #809db2); stroke-width: 1.25; }
    .kp-tick { stroke: var(--k-line, #383d48); stroke-width: 1; }
    .kp-sel { fill: none; stroke: var(--k-gold, #e4b65c); stroke-width: 1.5; }
    .kp-station { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-display, 'Fraunces', Georgia, serif); font-style: italic; font-size: 17px; }
    .kp-label { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-sans, 'Geist', system-ui, sans-serif); font-size: 11.5px; }
    .kp-head { fill: var(--k-silver, #b4cfe2); font-family: var(--k-font-sans, 'Geist', system-ui, sans-serif); font-size: 11.5px; font-weight: 500; }
    .kp-note { fill: var(--k-fg-3, #5d646c); font-family: var(--k-font-mono, 'Geist Mono', ui-monospace, monospace); font-size: 10.5px; }
    .kp-mono { fill: var(--k-fg-1, #bfc5ca); font-family: var(--k-font-mono, 'Geist Mono', ui-monospace, monospace); font-size: 12px; }
    .kp-bitval { fill: var(--k-silver, #b4cfe2); font-family: var(--k-font-mono, 'Geist Mono', ui-monospace, monospace); font-size: 15px; font-weight: 600; }
  </style>
  <rect class="kp-bg" x="0" y="0" width="760" height="320" rx="8"/>
  <!-- bit ruler -->
  <text class="kp-note" x="150" y="30">63</text>
  <text class="kp-note" x="190" y="30">62</text>
  <text class="kp-note" x="472" y="30">bits</text>
  <text class="kp-note" x="734" y="30">0</text>
  <path class="kp-tick" d="M150,36 H744"/>
  <text class="kp-head" x="182" y="54" text-anchor="end">namespace</text>
  <text class="kp-head" x="196" y="54">63 bits</text>
  <!-- authored -->
  <text class="kp-station" x="16" y="94">authored</text>
  <rect class="kp-bit" x="146" y="72" width="34" height="32" rx="3"/>
  <text class="kp-bitval" x="158" y="93">0</text>
  <rect class="kp-cell" x="186" y="72" width="558" height="32" rx="3"/>
  <text class="kp-mono" x="200" y="92">random — e.g. 2f9a 41c7 0b3e c4e1</text>
  <text class="kp-label" x="186" y="124">Drawn once, when the editor creates the entity; every save keeps it.</text>
  <text class="kp-label" x="186" y="140">Random, so two people editing one scene never hand out the same id.</text>
  <!-- within an instance -->
  <text class="kp-station" x="16" y="182">in an instance</text>
  <rect class="kp-bit" x="146" y="160" width="34" height="32" rx="3"/>
  <text class="kp-bitval" x="158" y="181">0</text>
  <rect class="kp-cell" x="186" y="160" width="558" height="32" rx="3"/>
  <text class="kp-mono" x="200" y="180">within(instance root, member's id in the prefab)</text>
  <text class="kp-label" x="186" y="212">Derived, not stored: the same on every load, different for every instance.</text>
  <text class="kp-label" x="186" y="228">Nested instances compose — within(within(root, nested), member).</text>
  <!-- created -->
  <text class="kp-station" x="16" y="270">created</text>
  <rect class="kp-bit" x="146" y="248" width="34" height="32" rx="3"/>
  <text class="kp-bitval" x="158" y="269">1</text>
  <rect class="kp-cell-soft" x="186" y="248" width="558" height="32" rx="3"/>
  <text class="kp-mono" x="200" y="268">n — the n-th identity this world handed out</text>
  <text class="kp-label" x="186" y="300">Spawned by the game or by code: numbered the first time a save or a lookup needs it.</text>
  <rect class="kp-sel" x="143" y="69" width="40" height="214" rx="4"/>
</svg>
