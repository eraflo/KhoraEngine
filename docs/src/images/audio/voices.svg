<svg id="fig-audio-voices" class="kp-figure" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kp-audio-voices-title kp-audio-voices-desc">
  <title id="kp-audio-voices-title">Five sounds and three voices: the most audible are mixed, the others advance silently</title>
  <desc id="kp-audio-voices-desc">A room holds a listener and five playing sounds. The mixer's level has three voices. The sounds are ranked by priority, then by how loud each is at the listener: the music has a high priority and keeps a voice, the steps and the fire are the loudest of the rest and are mixed, the river and the bell are virtual — silent, their place in the sound still advancing. The listener walks toward the bell: the bell is now louder than the steps, takes a voice, and the steps become virtual. The bell is heard from where it would have been, not from its start.</desc>
  <style>
    #fig-audio-voices { width: 100%; height: auto; display: block; margin: 1.5rem 0; }
    #fig-audio-voices .kp-bg { fill: var(--k-bg-0, #090d17); }
    #fig-audio-voices .kp-room { fill: var(--k-bg-1, #101622); stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-audio-voices .kp-row { fill: var(--k-bg-1, #101622); stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-audio-voices .kp-row-gold { fill: var(--k-bg-1, #101622); stroke: var(--k-gold, #e4b65c); stroke-width: 1.5; }
    #fig-audio-voices .kp-mixed { fill: var(--k-bg-2, #181e2b); stroke: var(--k-silver, #b4cfe2); stroke-width: 1.75; }
    #fig-audio-voices .kp-virtual { fill: none; stroke: var(--k-silver-dim, #809db2); stroke-width: 1.25; stroke-dasharray: 3 3; }
    #fig-audio-voices .kp-gold-ring { fill: var(--k-bg-2, #181e2b); stroke: var(--k-gold, #e4b65c); stroke-width: 2; }
    #fig-audio-voices .kp-ear { fill: var(--k-silver, #b4cfe2); }
    #fig-audio-voices .kp-cap { stroke: var(--k-silver-dim, #809db2); stroke-width: 1.25; stroke-dasharray: 6 4; }
    #fig-audio-voices .kp-path { stroke: var(--k-fg-3, #5d646c); stroke-width: 1; stroke-dasharray: 2 4; fill: none; }
    #fig-audio-voices .kp-station { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-display, 'Archivo', Georgia, serif); font-style: italic; font-size: 16px; }
    #fig-audio-voices .kp-label { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 12px; }
    #fig-audio-voices .kp-strong { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 12.5px; }
    #fig-audio-voices .kp-gold { fill: var(--k-gold, #e4b65c); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 12.5px; }
    #fig-audio-voices .kp-note { fill: var(--k-fg-3, #5d646c); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 10.5px; }
  </style>
  <rect class="kp-bg" x="0" y="0" width="760" height="330" rx="8"/>
  <!-- The room -->
  <rect class="kp-room" x="30" y="40" width="360" height="260" rx="6"/>
  <text class="kp-station" x="44" y="30">The room</text>
  <!-- Sources: A music, B steps, C fire, D river, E bell -->
  <circle class="kp-mixed" cx="70" cy="80" r="12"/>
  <text class="kp-strong" x="88" y="84">music</text>
  <circle class="kp-mixed" cx="200" cy="170" r="12"/>
  <text class="kp-strong" x="218" y="174">fire</text>
  <circle class="kp-virtual" cx="320" cy="260" r="12"/>
  <text class="kp-label" x="282" y="290">river</text>
  <g data-on="1 2">
    <circle class="kp-mixed" cx="150" cy="240" r="12"/>
    <text class="kp-strong" x="168" y="244">steps</text>
    <circle class="kp-virtual" cx="340" cy="90" r="12"/>
    <text class="kp-label" x="300" y="66">bell</text>
  </g>
  <g data-on="3 4">
    <circle class="kp-virtual" cx="150" cy="240" r="12"/>
    <text class="kp-label" x="168" y="244">steps</text>
    <circle class="kp-gold-ring" cx="340" cy="90" r="12"/>
    <text class="kp-gold" x="300" y="66">bell</text>
  </g>
  <!-- The listener, who walks toward the bell -->
  <path class="kp-path" d="M120,200 L292,128" data-on="3 4"/>
  <g data-tf="3:translate(180px, -76px)">
    <circle class="kp-ear" cx="120" cy="200" r="7"/>
    <text class="kp-note" x="96" y="222">listener</text>
  </g>
  <!-- The ranking -->
  <text class="kp-station" x="420" y="30">Ranked: priority, then loudness</text>
  <g data-on="1">
    <text class="kp-label" x="420" y="100">Five sounds play.</text>
    <text class="kp-label" x="420" y="120">This level mixes three voices;</text>
    <text class="kp-label" x="420" y="140">the engine's levels mix 8, 32 or 128.</text>
  </g>
  <g data-on="2">
    <rect class="kp-row" x="420" y="56" width="310" height="28" rx="4"/>
    <text class="kp-strong" x="432" y="75">music · priority 200</text>
    <text class="kp-label" x="670" y="75">mixed</text>
    <rect class="kp-row" x="420" y="92" width="310" height="28" rx="4"/>
    <text class="kp-strong" x="432" y="111">steps · nearest</text>
    <text class="kp-label" x="670" y="111">mixed</text>
    <rect class="kp-row" x="420" y="128" width="310" height="28" rx="4"/>
    <text class="kp-strong" x="432" y="147">fire</text>
    <text class="kp-label" x="670" y="147">mixed</text>
    <rect class="kp-row" x="420" y="180" width="310" height="28" rx="4"/>
    <text class="kp-label" x="432" y="199">river</text>
    <text class="kp-label" x="664" y="199">virtual</text>
    <rect class="kp-row" x="420" y="216" width="310" height="28" rx="4"/>
    <text class="kp-label" x="432" y="235">bell · farthest</text>
    <text class="kp-label" x="664" y="235">virtual</text>
  </g>
  <g data-on="3 4">
    <rect class="kp-row" x="420" y="56" width="310" height="28" rx="4"/>
    <text class="kp-strong" x="432" y="75">music · priority 200</text>
    <text class="kp-label" x="670" y="75">mixed</text>
    <rect class="kp-row-gold" x="420" y="92" width="310" height="28" rx="4"/>
    <text class="kp-gold" x="432" y="111">bell · nearest now</text>
    <text class="kp-gold" x="670" y="111">mixed</text>
    <rect class="kp-row" x="420" y="128" width="310" height="28" rx="4"/>
    <text class="kp-strong" x="432" y="147">fire</text>
    <text class="kp-label" x="670" y="147">mixed</text>
    <rect class="kp-row" x="420" y="180" width="310" height="28" rx="4"/>
    <text class="kp-label" x="432" y="199">river</text>
    <text class="kp-label" x="664" y="199">virtual</text>
    <rect class="kp-row" x="420" y="216" width="310" height="28" rx="4"/>
    <text class="kp-label" x="432" y="235">steps</text>
    <text class="kp-label" x="664" y="235">virtual</text>
  </g>
  <g data-on="2 3 4">
    <line class="kp-cap" x1="420" y1="168" x2="730" y2="168"/>
    <text class="kp-note" x="420" y="162">3 voices</text>
  </g>
  <g data-on="2">
    <text class="kp-note" x="420" y="272">virtual: silent, its place in the sound still moves</text>
  </g>
  <g data-on="4">
    <text class="kp-gold" x="420" y="272">The bell is heard from 0:42, where it would be,</text>
    <text class="kp-gold" x="420" y="290">not from 0:00: its place kept moving while silent.</text>
  </g>
</svg>
