<svg id="fig-home-descent" class="kp-figure" viewBox="0 0 760 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kp-descent-title kp-descent-desc">
  <title id="kp-descent-title">One frame, four layers</title>
  <desc id="kp-descent-desc">A frame goes down four layers. The conductor reads the machine: frame time, heat, battery, video memory. It plans the frame with a fast greedy plan, an exact search and a shield that checks the plan, and lends each family an envelope. Each family's agent picks the most capable way of doing its job whose cost fits under its envelope. The lanes run that way as layers: they read views from the bus and write their outputs to the deck. The world's data stays where it is: only its layout in memory may adapt, and the game never changes.</desc>
  <style>
    #fig-home-descent { width: 100%; height: auto; display: block; margin: 0; }
    #fig-home-descent .kp-bg { fill: var(--k-bg-0, #090d17); }
    #fig-home-descent .kp-band { fill: var(--k-bg-1, #101622); stroke: var(--k-line-soft, #1a1f29); stroke-width: 1; }
    #fig-home-descent .kp-band-on { fill: oklch(0.84 0.04 240 / 0.06); stroke: var(--k-silver-dim, #809db2); stroke-width: 1; }
    #fig-home-descent .kp-name { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 15px; font-weight: 500; }
    #fig-home-descent .kp-layer { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 11.5px; }
    #fig-home-descent .kp-rail { stroke: var(--k-line, #383d48); stroke-width: 1.5; }
    #fig-home-descent .kp-marker { fill: var(--k-silver, #b4cfe2); }
    #fig-home-descent .kp-chip { fill: var(--k-bg-2, #161c29); stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-home-descent .kp-box { fill: var(--k-bg-3, #1f2636); stroke: var(--k-silver-dim, #809db2); stroke-width: 1; }
    #fig-home-descent .kp-text { fill: var(--k-fg-1, #c4c9cf); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 12.5px; }
    #fig-home-descent .kp-small { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 11px; }
    #fig-home-descent .kp-head { fill: var(--k-silver, #b4cfe2); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 12.5px; font-weight: 500; }
    #fig-home-descent .kp-arrow { stroke: var(--k-silver-dim, #809db2); stroke-width: 1.2; fill: none; }
    #fig-home-descent .kp-arrow-head { fill: var(--k-silver-dim, #809db2); }
    #fig-home-descent .kp-row { fill: var(--k-bg-3, #1f2636); stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-home-descent .kp-row-on { fill: var(--k-silver, #b4cfe2); }
    #fig-home-descent .kp-limit { stroke: var(--k-gold, #e4b65c); stroke-width: 2; }
    #fig-home-descent .kp-page { fill: var(--k-bg-2, #161c29); stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-home-descent .kp-column { fill: var(--k-silver-dim, #809db2); opacity: 0.55; }
  </style>
  <defs>
    <marker id="kp-descent-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="kp-arrow-head" d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>
  <rect class="kp-bg" x="0" y="0" width="760" height="408" rx="10"/>
  <!-- the four layers -->
  <rect class="kp-band" x="16" y="16" width="728" height="88" rx="8"/>
  <rect class="kp-band" x="16" y="112" width="728" height="88" rx="8"/>
  <rect class="kp-band" x="16" y="208" width="728" height="88" rx="8"/>
  <rect class="kp-band" x="16" y="304" width="728" height="88" rx="8"/>
  <rect class="kp-band-on" x="16" y="16" width="728" height="88" rx="8" data-on="1 2"/>
  <rect class="kp-band-on" x="16" y="112" width="728" height="88" rx="8" data-on="3"/>
  <rect class="kp-band-on" x="16" y="208" width="728" height="88" rx="8" data-on="4"/>
  <rect class="kp-band-on" x="16" y="304" width="728" height="88" rx="8" data-on="5"/>
  <text class="kp-name" x="36" y="56">The conductor</text>
  <text class="kp-layer" x="36" y="76">Control · DCC</text>
  <text class="kp-name" x="36" y="152">Each family</text>
  <text class="kp-layer" x="36" y="172">Agent</text>
  <text class="kp-name" x="36" y="248">The work</text>
  <text class="kp-layer" x="36" y="268">Lane</text>
  <text class="kp-name" x="36" y="344">Your world</text>
  <text class="kp-layer" x="36" y="364">Data</text>
  <!-- the descent: where the frame is -->
  <line class="kp-rail" x1="196" y1="32" x2="196" y2="376"/>
  <circle class="kp-marker" cx="196" cy="60" r="6" data-tf="3:translate(0px, 96px)|4:translate(0px, 192px)|5:translate(0px, 288px)"/>
  <!-- Control: what the conductor reads -->
  <rect class="kp-chip" x="220" y="28" width="92" height="26" rx="13"/>
  <text class="kp-text" x="266" y="45.5" text-anchor="middle">frame time</text>
  <rect class="kp-chip" x="320" y="28" width="56" height="26" rx="13"/>
  <text class="kp-text" x="348" y="45.5" text-anchor="middle">heat</text>
  <rect class="kp-chip" x="384" y="28" width="72" height="26" rx="13"/>
  <text class="kp-text" x="420" y="45.5" text-anchor="middle">battery</text>
  <rect class="kp-chip" x="464" y="28" width="108" height="26" rx="13"/>
  <text class="kp-text" x="518" y="45.5" text-anchor="middle">video memory</text>
  <!-- Control: how it plans -->
  <g data-on="2 3 4 5">
    <rect class="kp-box" x="220" y="64" width="124" height="28" rx="5"/>
    <text class="kp-text" x="282" y="82.5" text-anchor="middle">fast greedy plan</text>
    <line class="kp-arrow" x1="346" y1="78" x2="364" y2="78" marker-end="url(#kp-descent-arrow)"/>
    <rect class="kp-box" x="368" y="64" width="104" height="28" rx="5"/>
    <text class="kp-text" x="420" y="82.5" text-anchor="middle">exact search</text>
    <line class="kp-arrow" x1="474" y1="78" x2="492" y2="78" marker-end="url(#kp-descent-arrow)"/>
    <rect class="kp-box" x="496" y="64" width="76" height="28" rx="5"/>
    <text class="kp-text" x="534" y="82.5" text-anchor="middle">shield</text>
    <line class="kp-arrow" x1="574" y1="78" x2="592" y2="78" marker-end="url(#kp-descent-arrow)"/>
    <text class="kp-head" x="598" y="74">an envelope</text>
    <text class="kp-small" x="598" y="90">per family</text>
  </g>
  <!-- Agent: each family picks the row that fits its envelope -->
  <g data-on="3 4 5">
    <text class="kp-head" x="220" y="134">render</text>
    <rect class="kp-row" x="220" y="142" width="150" height="12" rx="3"/>
    <rect class="kp-row-on" x="220" y="160" width="104" height="12" rx="3"/>
    <rect class="kp-row" x="220" y="178" width="66" height="12" rx="3"/>
    <line class="kp-limit" x1="338" y1="138" x2="338" y2="194"/>
    <text class="kp-head" x="398" y="134">physics</text>
    <rect class="kp-row" x="398" y="142" width="140" height="12" rx="3"/>
    <rect class="kp-row-on" x="398" y="160" width="90" height="12" rx="3"/>
    <rect class="kp-row" x="398" y="178" width="56" height="12" rx="3"/>
    <line class="kp-limit" x1="500" y1="138" x2="500" y2="194"/>
    <text class="kp-head" x="576" y="134">scripts</text>
    <rect class="kp-row-on" x="576" y="142" width="120" height="12" rx="3"/>
    <rect class="kp-row" x="576" y="160" width="80" height="12" rx="3"/>
    <rect class="kp-row" x="576" y="178" width="44" height="12" rx="3"/>
    <line class="kp-limit" x1="706" y1="138" x2="706" y2="194"/>
  </g>
  <!-- Lane: layers read the bus and write the deck -->
  <g data-on="4 5">
    <rect class="kp-box" x="220" y="232" width="96" height="42" rx="5"/>
    <text class="kp-text" x="268" y="250" text-anchor="middle">views</text>
    <text class="kp-small" x="268" y="265" text-anchor="middle">from the bus</text>
    <line class="kp-arrow" x1="318" y1="253" x2="340" y2="253" marker-end="url(#kp-descent-arrow)"/>
    <rect class="kp-box" x="344" y="232" width="90" height="42" rx="5"/>
    <text class="kp-text" x="389" y="250" text-anchor="middle">render</text>
    <text class="kp-small" x="389" y="265" text-anchor="middle">layer</text>
    <rect class="kp-box" x="442" y="232" width="90" height="42" rx="5"/>
    <text class="kp-text" x="487" y="250" text-anchor="middle">physics</text>
    <text class="kp-small" x="487" y="265" text-anchor="middle">layer</text>
    <rect class="kp-box" x="540" y="232" width="90" height="42" rx="5"/>
    <text class="kp-text" x="585" y="250" text-anchor="middle">scripts</text>
    <text class="kp-small" x="585" y="265" text-anchor="middle">layer</text>
    <line class="kp-arrow" x1="632" y1="253" x2="654" y2="253" marker-end="url(#kp-descent-arrow)"/>
    <rect class="kp-box" x="658" y="232" width="72" height="42" rx="5"/>
    <text class="kp-text" x="694" y="250" text-anchor="middle">outputs</text>
    <text class="kp-small" x="694" y="265" text-anchor="middle">the deck</text>
  </g>
  <!-- Data: pages of entities, the same in every step; their layout may change -->
  <rect class="kp-page" x="220" y="320" width="70" height="56" rx="4"/>
  <rect class="kp-page" x="300" y="320" width="70" height="56" rx="4"/>
  <rect class="kp-page" x="380" y="320" width="70" height="56" rx="4"/>
  <g data-on="1 2 3 4">
    <rect class="kp-column" x="228" y="328" width="54" height="10" rx="2"/>
    <rect class="kp-column" x="228" y="343" width="54" height="10" rx="2"/>
    <rect class="kp-column" x="228" y="358" width="54" height="10" rx="2"/>
    <rect class="kp-column" x="308" y="328" width="54" height="10" rx="2"/>
    <rect class="kp-column" x="308" y="343" width="54" height="10" rx="2"/>
    <rect class="kp-column" x="308" y="358" width="54" height="10" rx="2"/>
    <rect class="kp-column" x="388" y="328" width="54" height="10" rx="2"/>
    <rect class="kp-column" x="388" y="343" width="54" height="10" rx="2"/>
    <rect class="kp-column" x="388" y="358" width="54" height="10" rx="2"/>
  </g>
  <g data-on="5">
    <rect class="kp-column" x="228" y="328" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="258" y="328" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="228" y="343" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="258" y="343" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="228" y="358" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="258" y="358" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="308" y="328" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="338" y="328" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="308" y="343" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="338" y="343" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="308" y="358" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="338" y="358" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="388" y="328" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="418" y="328" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="388" y="343" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="418" y="343" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="388" y="358" width="24" height="10" rx="2"/>
    <rect class="kp-column" x="418" y="358" width="24" height="10" rx="2"/>
  </g>
  <text class="kp-text" x="476" y="342">entities, in pages by what they mean</text>
  <text class="kp-head" x="476" y="362" data-on="5">only their layout may adapt</text>
</svg>
