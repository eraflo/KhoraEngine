[package]
name = "khora-agents"
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Intelligent wrappers driving the Lanes"

[dependencies]
khora-core = { path = "../khora-core" }
khora-data = { path = "../khora-data" }
khora-lanes = { path = "../khora-lanes" }
khora-script = { path = "../khora-script" }

log = "0.4"

[dev-dependencies]
khora-control = { path = "../khora-control" }
khora-io = { path = "../khora-io" }
khora-infra = { path = "../khora-infra" }
khora-telemetry = { path = "../khora-telemetry" }
anyhow = "1.0"
image = "0.25.9"
tempfile = "3.25.0"
bincode = { version = "2.0.1", features = ["serde"] }
