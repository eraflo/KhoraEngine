<svg id="fig-clad-pillars" class="kp-figure" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kp-clad-pillars-title kp-clad-pillars-desc">
  <title id="kp-clad-pillars-title">Where each SAA idea lives in the crates</title>
  <desc id="kp-clad-pillars-desc">On the left, the ideas of the Symbiotic Adaptive Architecture; on the right, the crates that hold them. The Dynamic Context Core and the GORNA protocol live in khora-control, GORNA's message types in khora-core. The intelligent subsystem agents are khora-agents, which holds the one LaneAgent, and khora-lanes, which holds the families. Adaptive data flows live in khora-data, the contracts in khora-core, the I/O services and the trust boundary in khora-io, observability in khora-telemetry, and the hardware backends in khora-infra.</desc>
  <style>
    #fig-clad-pillars { width: 100%; height: auto; display: block; margin: 0; }
    #fig-clad-pillars .kp-bg { fill: var(--k-bg-0, #090d17); }
    #fig-clad-pillars .kp-idea { fill: var(--k-bg-1, #101622); stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-clad-pillars .kp-crate { fill: var(--k-bg-3, #1f2636); stroke: var(--k-silver-dim, #809db2); stroke-width: 1; }
    #fig-clad-pillars .kp-link { stroke: var(--k-silver-dim, #809db2); stroke-width: 1; fill: none; }
    #fig-clad-pillars .kp-link-soft { stroke: var(--k-line, #383d48); stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    #fig-clad-pillars .kp-head { fill: var(--k-silver, #b4cfe2); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 12px; font-weight: 500; }
    #fig-clad-pillars .kp-station { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-display, 'Archivo', Georgia, serif); font-style: italic; font-size: 12.5px; }
    #fig-clad-pillars .kp-name { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 11.5px; }
  </style>
