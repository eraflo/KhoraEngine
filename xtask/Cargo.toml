[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

# No engine crate: `cargo gate` builds xtask before anything else, and an
# engine dependency would compile the whole engine just to start it. What
# needs the engine runs as the engine's own binary (`khora-pack`).
[dependencies]
clap = { version = "4.5.60", features = ["derive", "cargo"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.2"
