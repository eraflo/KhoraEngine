[package]
name = "sandbox"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Sandbox example demonstrating high-level game logic"

[[bin]]
name = "sandbox"
path = "src/main.rs"
# The example game holds no test of its own: built as a test it would link the
# whole engine for nothing. `xtask`'s manifest checks keep a test from hiding
# here.
test = false

[dependencies]
khora-sdk = { path = "../../crates/khora-sdk" }

env_logger = "0.11"
anyhow = "1.0"
log = "0.4.29"
bytemuck = { version = "1.25", features = ["derive"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
