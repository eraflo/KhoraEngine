<svg id="fig-scripting-flipbook" class="kp-figure" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kp-flipbook-title kp-flipbook-desc">
  <title id="kp-flipbook-title">A game is a flip-book, and a script is what a character does on each page</title>
  <desc id="kp-flipbook-desc">Four pages of a flip-book, each one frame of the game. On each page a guard takes its turn: its script says to take a step toward a coin. The guard does not move itself; it hands the engine a note, a step to the right, and the engine carries it out before drawing the next page. Page after page the guard comes closer, and on the fourth page it reaches the coin.</desc>
  <style>
    #fig-scripting-flipbook { width: 100%; height: auto; display: block; margin: 1.5rem 0; }
    #fig-scripting-flipbook .kp-bg { fill: var(--k-bg-0, #090d17); }
    #fig-scripting-flipbook .kp-page { fill: var(--k-bg-1, #101622); stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-scripting-flipbook .kp-page-now { fill: none; stroke: var(--k-silver, #b4cfe2); stroke-width: 1.5; }
    #fig-scripting-flipbook .kp-ground { stroke: var(--k-line, #383d48); stroke-width: 1.5; }
    #fig-scripting-flipbook .kp-guard { fill: var(--k-silver-dim, #809db2); }
    #fig-scripting-flipbook .kp-guard-ghost { fill: var(--k-silver-dim, #809db2); opacity: 0.22; }
    #fig-scripting-flipbook .kp-coin { fill: var(--k-gold, #e4b65c); }
    #fig-scripting-flipbook .kp-ring { fill: none; stroke: var(--k-gold, #e4b65c); stroke-width: 1.5; }
    #fig-scripting-flipbook .kp-card { fill: var(--k-bg-1, #101622); stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-scripting-flipbook .kp-card-on { fill: none; stroke: var(--k-silver, #b4cfe2); stroke-width: 1.5; }
    #fig-scripting-flipbook .kp-note-chip { fill: var(--k-bg-2, #181e2b); stroke: var(--k-silver, #b4cfe2); stroke-width: 1.25; }
    #fig-scripting-flipbook .kp-flow { fill: none; stroke: var(--k-fg-3, #5d646c); stroke-width: 1.25; stroke-dasharray: 3 4; }
    #fig-scripting-flipbook .kp-station { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-display, 'Archivo', Georgia, serif); font-style: italic; font-size: 17px; }
    #fig-scripting-flipbook .kp-label { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 12px; }
    #fig-scripting-flipbook .kp-strong { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 12.5px; }
    #fig-scripting-flipbook .kp-chip-text { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 11.5px; }
    #fig-scripting-flipbook .kp-note { fill: var(--k-fg-3, #5d646c); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 10.5px; }
  </style>
  <rect class="kp-bg" x="0" y="0" width="760" height="340" rx="8"/>
  <!-- Page 1 -->
  <text class="kp-note" x="30" y="30">frame 1</text>
  <rect class="kp-page" x="30" y="40" width="160" height="140" rx="6"/>
  <line class="kp-ground" x1="42" y1="160" x2="178" y2="160"/>
  <circle class="kp-coin" cx="165" cy="150" r="8"/>
  <g class="kp-guard"><circle cx="60" cy="116" r="9"/><rect x="51" y="128" width="18" height="30" rx="6"/></g>
  <rect class="kp-page-now" x="28" y="38" width="164" height="144" rx="7" data-on="1 2 3"/>
  <!-- Page 2 -->
  <g data-on="4">
    <text class="kp-note" x="210" y="30">frame 2 · 1/60 s later</text>
    <rect class="kp-page" x="210" y="40" width="160" height="140" rx="6"/>
    <line class="kp-ground" x1="222" y1="160" x2="358" y2="160"/>
    <circle class="kp-coin" cx="345" cy="150" r="8"/>
    <g class="kp-guard-ghost"><circle cx="240" cy="116" r="9"/><rect x="231" y="128" width="18" height="30" rx="6"/></g>
    <g class="kp-guard"><circle cx="270" cy="116" r="9"/><rect x="261" y="128" width="18" height="30" rx="6"/></g>
  </g>
  <!-- Page 3 -->
  <g data-on="4">
    <text class="kp-note" x="390" y="30">frame 3</text>
    <rect class="kp-page" x="390" y="40" width="160" height="140" rx="6"/>
    <line class="kp-ground" x1="402" y1="160" x2="538" y2="160"/>
    <circle class="kp-coin" cx="525" cy="150" r="8"/>
    <g class="kp-guard-ghost"><circle cx="450" cy="116" r="9"/><rect x="441" y="128" width="18" height="30" rx="6"/></g>
    <g class="kp-guard"><circle cx="480" cy="116" r="9"/><rect x="471" y="128" width="18" height="30" rx="6"/></g>
  </g>
  <!-- Page 4 -->
  <g data-on="4">
    <text class="kp-note" x="570" y="30">frame 4</text>
    <rect class="kp-page" x="570" y="40" width="160" height="140" rx="6"/>
    <line class="kp-ground" x1="582" y1="160" x2="718" y2="160"/>
    <circle class="kp-ring" cx="705" cy="150" r="13"/>
    <g class="kp-guard-ghost"><circle cx="660" cy="116" r="9"/><rect x="651" y="128" width="18" height="30" rx="6"/></g>
    <g class="kp-guard"><circle cx="690" cy="116" r="9"/><rect x="681" y="128" width="18" height="30" rx="6"/></g>
    <text class="kp-strong" x="592" y="66">got it</text>
  </g>
  <!-- The guard's script -->
  <g data-on="2 3 4">
    <rect class="kp-card" x="30" y="214" width="330" height="100" rx="6"/>
    <rect class="kp-card-on" x="28" y="212" width="334" height="104" rx="7" data-on="2"/>
    <text class="kp-station" x="46" y="242">the guard's script</text>
    <text class="kp-label" x="46" y="268">every frame, on its turn:</text>
    <text class="kp-strong" x="46" y="290">take one step toward the coin</text>
    <path class="kp-flow" d="M60,160 V212"/>
  </g>
  <!-- The engine -->
  <g data-on="3 4">
    <rect class="kp-card" x="400" y="214" width="330" height="100" rx="6"/>
    <rect class="kp-card-on" x="398" y="212" width="334" height="104" rx="7" data-on="3"/>
    <text class="kp-station" x="416" y="242">the engine</text>
    <text class="kp-label" x="416" y="268">does what the notes ask,</text>
    <text class="kp-label" x="416" y="288">then draws the next page</text>
  </g>
  <!-- The note the guard hands over -->
  <g data-on="3" data-tf="3:translate(500px, 140px)">
    <rect class="kp-note-chip" x="80" y="84" width="104" height="24" rx="12"/>
    <text class="kp-chip-text" x="94" y="100">one step right →</text>
  </g>
</svg>
