[package]
name = "khora-runtime"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Generic Khora game runtime — the binary the editor's Build feature stamps with packed project assets."

[[bin]]
name = "khora-runtime"
path = "src/main.rs"
# The player holds no test of its own: built as a test it would link the whole
# engine for nothing. `xtask`'s manifest checks keep a test from hiding here.
test = false

[dependencies]
khora-sdk = { path = "../khora-sdk" }

anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
