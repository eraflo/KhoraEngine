<svg class="kp-figure" viewBox="0 0 760 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kp-play-title kp-play-desc">
  <title id="kp-play-title">Editing, playing, paused: what runs in each</title>
  <desc id="kp-play-desc">Editing runs the editor's own engine mode, in which no script runs. Play snapshots the scene and switches to the Playing mode: scripts run, and every scripted entity arrives fresh and runs OnSpawn. Pause keeps the Playing mode with a delta of zero, so scripts still run but time stands still. Stop, from playing or paused, restores the snapshot and returns to editing; the next Play starts fresh again, never with OnLoad.</desc>
  <style>
    .kp-figure { width: 100%; height: auto; display: block; margin: 1.5rem 0; }
    .kp-bg { fill: var(--k-bg-0, #090d17); }
    .kp-card { fill: var(--k-bg-1, #101622); stroke: var(--k-line, #383d48); stroke-width: 1; }
    .kp-card-on { fill: var(--k-bg-1, #101622); stroke: var(--k-silver-dim, #809db2); stroke-width: 1.25; }
    .kp-arrow { fill: none; stroke: var(--k-silver-dim, #809db2); stroke-width: 1.25; }
    .kp-tip { fill: var(--k-silver-dim, #809db2); }
    .kp-thread { fill: none; stroke: var(--k-gold, #e4b65c); stroke-width: 1.5; }
    .kp-tip-gold { fill: var(--k-gold, #e4b65c); }
    .kp-station { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-display, 'Fraunces', Georgia, serif); font-style: italic; font-size: 17px; }
    .kp-head { fill: var(--k-silver, #b4cfe2); font-family: var(--k-font-sans, 'Geist', system-ui, sans-serif); font-size: 11.5px; font-weight: 500; }
    .kp-label { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-sans, 'Geist', system-ui, sans-serif); font-size: 11.5px; }
    .kp-note { fill: var(--k-fg-3, #5d646c); font-family: var(--k-font-mono, 'Geist Mono', ui-monospace, monospace); font-size: 10.5px; }
  </style>
  <rect class="kp-bg" x="0" y="0" width="760" height="276" rx="8"/>
  <!-- editing -->
  <rect class="kp-card" x="16" y="40" width="200" height="124" rx="6"/>
  <text class="kp-station" x="32" y="68">editing</text>
  <text class="kp-note" x="32" y="88">Custom("editor")</text>
  <text class="kp-label" x="32" y="120">no script runs</text>
  <text class="kp-label" x="32" y="140">you change the scene</text>
  <!-- playing -->
  <rect class="kp-card-on" x="280" y="40" width="200" height="124" rx="6"/>
  <text class="kp-station" x="296" y="68">playing</text>
  <text class="kp-note" x="296" y="88">EngineMode::Playing</text>
  <text class="kp-label" x="296" y="120">scripts run</text>
  <text class="kp-label" x="296" y="140">each entity: OnSpawn</text>
  <!-- paused -->
  <rect class="kp-card" x="544" y="40" width="200" height="124" rx="6"/>
  <text class="kp-station" x="560" y="68">paused</text>
  <text class="kp-note" x="560" y="88">EngineMode::Playing</text>
  <text class="kp-label" x="560" y="120">scripts run, delta 0</text>
  <text class="kp-label" x="560" y="140">time stands still</text>
  <!-- play -->
  <text class="kp-head" x="230" y="70">Play</text>
  <path class="kp-arrow" d="M220,80 H272"/>
  <path class="kp-tip" d="M272,75 L278,80 L272,85 Z"/>
  <text class="kp-note" x="222" y="100">snapshot</text>
  <!-- pause and resume -->
  <text class="kp-head" x="490" y="70">Pause</text>
  <path class="kp-arrow" d="M484,80 H536"/>
  <path class="kp-tip" d="M536,75 L542,80 L536,85 Z"/>
  <path class="kp-arrow" d="M540,124 H488"/>
  <path class="kp-tip" d="M488,119 L482,124 L488,129 Z"/>
  <text class="kp-head" x="490" y="144">Play</text>
  <!-- stop -->
  <path class="kp-thread" d="M380,164 V200 H116 V172"/>
  <path class="kp-thread" d="M644,164 V200 H380"/>
  <path class="kp-tip-gold" d="M111,172 L116,165 L121,172 Z"/>
  <text class="kp-head" x="134" y="222">Stop</text>
  <text class="kp-label" x="176" y="222">— from playing or paused: the snapshot comes back, the game's changes are gone</text>
  <text class="kp-note" x="16" y="258">the next Play starts fresh again: OnSpawn, never OnLoad — OnLoad is for restoring a game save</text>
</svg>
