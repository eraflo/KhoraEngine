[package]
name = "khora-core"
version = "0.2.2"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Foundational crate with traits, core types, and interface contracts"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }

# Math and approximation
approx = "0.5"

# Portable, stable-Rust explicit SIMD for the batched transform kernels
# (the AGDF compute-heavy "hot loop" lever). `f32x8` maps 1:1 to an 8-wide
# AoSoA tile; see `math::simd`.
wide = "0.7"

# Error handling
anyhow = "1.0"

# Async support
async-trait = "0.1"

# Serialization
uuid = { version = "1.20.0", features = ["v4", "v5", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }

# Logging
log = "0.4"

# Link-time registration of the mailboxes (`event::mailbox`).
inventory = "0.3"

# Handle
raw-window-handle = "0.6"

[dev-dependencies]
criterion = "0.8"
# The lane derives, tested here against the types they name. A dev
# dependency only: khora-core ships depending on no workspace crate.
khora-macros = { path = "../khora-macros" }
# Compile-fail tests pinning the derive and `register_agent!` diagnostics.
trybuild = "1.0"

[[bench]]
name = "channel_bench"
harness = false
