    <path class="kp-edge" d="M330 144 L275 270"/>
    <path class="kp-edge" d="M400 144 L440 270"/>
    <path class="kp-edge" d="M380 144 L437 350"/>
    <path class="kp-edge" d="M310 144 L110 350"/>
    <path class="kp-edge" d="M305 144 L185 265 L207 350"/>
    <path class="kp-edge" d="M460 130 H610 V330 H570 V350"/>
