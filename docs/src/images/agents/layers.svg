<svg id="fig-agents-layers" class="kp-figure" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kp-agents-layers-title kp-agents-layers-desc">
  <title id="kp-agents-layers-title">Lanes are layers</title>
  <desc id="kp-agents-layers-desc">The frame is a stack of places, one for each family of work. On each place lies one transparent layer: a lane, prepared at one level. Every frame the scheduler applies the layers, top to bottom, without asking any agent. When a layer's price no longer fits its envelope, it wakes its agent. The agent prepares the new layer beside the stack while the old one keeps running. At the next frame start the new layer takes the old one's place, the same place, and the old one is put aside for three epochs, so going back to it costs nothing; then it is released.</desc>
  <style>
    #fig-agents-layers { width: 100%; height: auto; display: block; margin: 0; }
    #fig-agents-layers .kp-bg { fill: var(--k-bg-0, #090d17); }
    #fig-agents-layers .kp-place { fill: var(--k-bg-1, #101622); stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-agents-layers .kp-layer { fill: var(--k-bg-3, #1f2636); stroke: var(--k-silver-dim, #809db2); stroke-width: 1; }
    #fig-agents-layers .kp-layer-lead { fill: oklch(0.32 0.04 245); stroke: var(--k-gold, #e4b65c); stroke-width: 2; }
    #fig-agents-layers .kp-layer-new { fill: oklch(0.32 0.04 245); stroke: var(--k-gold, #e4b65c); stroke-width: 2; stroke-dasharray: 5 3; }
    #fig-agents-layers .kp-layer-kept { fill: none; stroke: var(--k-silver-dim, #809db2); stroke-width: 1; stroke-dasharray: 3 3; }
    #fig-agents-layers .kp-scan { stroke: var(--k-silver, #b4cfe2); stroke-width: 2; }
    #fig-agents-layers .kp-alert { fill: var(--k-amber, #e8a33d); }
    #fig-agents-layers .kp-thread { stroke: var(--k-gold, #e4b65c); stroke-width: 1.6; fill: none; stroke-dasharray: 4 3; }
    #fig-agents-layers .kp-agent { fill: var(--k-bg-3, #1f2636); stroke: var(--k-silver, #b4cfe2); stroke-width: 1; }
    #fig-agents-layers .kp-station { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 11.5px; font-style: italic; }
    #fig-agents-layers .kp-name { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 11.5px; }
    #fig-agents-layers .kp-head { fill: var(--k-silver, #b4cfe2); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 12px; font-weight: 500; }
    #fig-agents-layers .kp-how { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 11.5px; }
    #fig-agents-layers .kp-warn { fill: var(--k-amber, #e8a33d); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 11.5px; }
    #fig-agents-layers .kp-gold { fill: var(--k-gold, #e4b65c); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 11.5px; }
  </style>
  <rect class="kp-bg" x="0" y="0" width="760" height="330" rx="10"/>
  <text class="kp-head" x="40" y="34">the frame: one place for each family</text>
  <!-- the places -->
  <rect class="kp-place" x="40" y="48" width="400" height="40" rx="5"/>
  <text class="kp-station" x="50" y="72">Transform · physics</text>
  <rect class="kp-place" x="40" y="94" width="400" height="40" rx="5"/>
  <text class="kp-station" x="50" y="118">Output · shadows</text>
  <rect class="kp-place" x="40" y="140" width="400" height="40" rx="5"/>
  <text class="kp-station" x="50" y="164">Output · sky</text>
  <rect class="kp-place" x="40" y="186" width="400" height="40" rx="5"/>
  <text class="kp-station" x="50" y="210">Output · UI</text>
  <!-- the layers installed -->
  <rect class="kp-layer" x="220" y="54" width="200" height="28" rx="4"/>
  <text class="kp-name" x="230" y="73">its one step</text>
  <rect class="kp-layer" x="220" y="146" width="200" height="28" rx="4"/>
  <text class="kp-name" x="230" y="165">sky · cube map</text>
  <rect class="kp-layer" x="220" y="192" width="200" height="28" rx="4"/>
  <text class="kp-name" x="230" y="211">UI · full text</text>
  <g data-on="1 2 3 4">
    <rect class="kp-layer-lead" x="220" y="100" width="200" height="28" rx="4"/>
    <text class="kp-name" x="230" y="119">shadows · high</text>
  </g>
  <!-- the agent -->
  <rect class="kp-agent" x="560" y="94" width="160" height="40" rx="6"/>
  <text class="kp-name" x="572" y="118">shadows' agent</text>
  <g data-on="1">
    <text class="kp-how" x="40" y="258">Each family has a fixed place in the frame: its phase, and for what draws</text>
    <text class="kp-how" x="40" y="276">its pass. On it lies one layer: one of its lanes, prepared at one level.</text>
  </g>
  <!-- 2. the scheduler applies the layers -->
  <g data-on="2">
    <line class="kp-scan" x1="448" y1="48" x2="448" y2="226"/>
    <text class="kp-how" x="40" y="258">Every frame the scheduler applies every layer, place after place.</text>
    <text class="kp-how" x="40" y="276">No agent is called, none is locked: on a quiet frame they cost nothing.</text>
  </g>
  <!-- 3. the wake -->
  <g data-on="3">
    <circle class="kp-alert" cx="428" cy="114" r="6"/>
    <path class="kp-thread" d="M434 114 L560 114"/>
    <text class="kp-warn" x="460" y="160">2.9 ms &gt; its 2.6 ms envelope</text>
    <text class="kp-how" x="40" y="258">The layer prices its own run. When the price no longer fits the envelope,</text>
    <text class="kp-how" x="40" y="276">it wakes its agent; so do a new allocation, a lane error, a refused input.</text>
  </g>
  <!-- 4. prepared beside -->
  <g data-on="4">
    <rect class="kp-layer-new" x="540" y="184" width="200" height="28" rx="4"/>
    <text class="kp-name" x="550" y="203">shadows · medium</text>
    <text class="kp-gold" x="540" y="232">prepared beside</text>
    <text class="kp-how" x="40" y="258">The agent chooses the row that fits and prepares a fresh layer of it beside</text>
    <text class="kp-how" x="40" y="276">the stack, its pipelines and buffers. The old layer keeps running meanwhile.</text>
  </g>
  <!-- 5. the swap -->
  <g data-on="5 6">
    <rect class="kp-layer-lead" x="220" y="100" width="200" height="28" rx="4"/>
    <text class="kp-name" x="230" y="119">shadows · medium</text>
    <rect class="kp-layer-kept" x="540" y="184" width="200" height="28" rx="4"/>
    <text class="kp-name" x="550" y="203">shadows · high</text>
  </g>
  <g data-on="5">
    <text class="kp-how" x="540" y="232">put aside, 3 epochs left</text>
    <text class="kp-how" x="40" y="258">At the next frame start the new layer takes the old one's place: the same</text>
    <text class="kp-how" x="40" y="276">place, the same outputs. No frame is ever left without a layer.</text>
  </g>
  <!-- 6. kept, then released -->
  <g data-on="6">
    <text class="kp-how" x="540" y="232">each allocation: one epoch less</text>
    <text class="kp-how" x="40" y="258">Going back within three epochs reuses the layer put aside: nothing to prepare.</text>
    <text class="kp-how" x="40" y="276">Then it is released, or at once if the envelope's memory cannot hold both.</text>
  </g>
</svg>
