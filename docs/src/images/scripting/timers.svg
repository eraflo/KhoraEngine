<svg id="fig-scripting-timers" class="kp-figure" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kp-timers-title kp-timers-desc">
  <title id="kp-timers-title">An every 0.5s timer counting game time across turns</title>
  <desc id="kp-timers-desc">A timeline of game time from 0 to 2 seconds. The timer is armed due at 0.5 s. A turn at 0.3 s leaves 0.2 s to go and fires nothing. A turn at 0.6 s finds it due: it fires once, and the 0.1 s it overshot is carried, so the next is due at 1.0 s, not 1.1 s. An instance that sat out until 1.6 s finds it far behind: it fires once that turn, is still due, fires once more at the next turn at 1.65 s, and is next due at 2.0 s.</desc>
  <style>
    #fig-scripting-timers { width: 100%; height: auto; display: block; margin: 1.5rem 0; }
    #fig-scripting-timers .kp-bg { fill: var(--k-bg-0, #090d17); }
    #fig-scripting-timers .kp-card { fill: var(--k-bg-1, #101622); stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-scripting-timers .kp-axis { stroke: var(--k-line, #383d48); stroke-width: 1.25; fill: none; }
    #fig-scripting-timers .kp-due { stroke: var(--k-gold, #e4b65c); stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
    #fig-scripting-timers .kp-turn { stroke: var(--k-silver, #b4cfe2); stroke-width: 2; fill: none; }
    #fig-scripting-timers .kp-over { stroke: var(--k-gold, #e4b65c); stroke-width: 1.25; fill: none; }
    #fig-scripting-timers .kp-chip { fill: var(--k-bg-0, #090d17); stroke: var(--k-gold, #e4b65c); stroke-width: 1.25; }
    #fig-scripting-timers .kp-chip-text { fill: var(--k-gold, #e4b65c); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 10.5px; }
    #fig-scripting-timers .kp-station { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-display, 'Archivo', Georgia, serif); font-style: italic; font-size: 16px; }
    #fig-scripting-timers .kp-head { fill: var(--k-silver, #b4cfe2); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 11.5px; font-weight: 500; }
    #fig-scripting-timers .kp-label { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 11.5px; }
    #fig-scripting-timers .kp-code { fill: var(--k-silver, #b4cfe2); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 10.5px; }
    #fig-scripting-timers .kp-note { fill: var(--k-fg-3, #5d646c); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 10.5px; }
  </style>
  <rect class="kp-bg" x="0" y="0" width="760" height="300" rx="8"/>
  <text class="kp-head" x="24" y="30">every 0.5s — game time, in seconds</text>
  <text class="kp-code" x="24" y="52">behavior Guard { every 0.5s { … } }</text>
  <!-- The state of the countdown, one line per step -->
  <rect class="kp-card" x="440" y="18" width="296" height="62" rx="5"/>
  <text class="kp-station" x="454" y="42">the countdown</text>
  <text class="kp-code" x="454" y="66" data-on="1">armed: 0.5 s to go</text>
  <text class="kp-code" x="454" y="66" data-on="2">0.5 − 0.3 = 0.2 s to go</text>
  <text class="kp-code" x="454" y="66" data-on="3">0.2 − 0.3 = −0.1 → fires; 0.5 − 0.1 = 0.4</text>
  <text class="kp-code" x="454" y="66" data-on="4">−0.6 fires → −0.1; −0.15 fires → 0.35</text>
  <!-- The axis: x = 60 + 300 t -->
  <path class="kp-axis" d="M60,220 H690"/>
  <path class="kp-axis" d="M60,214 V226 M210,214 V226 M360,214 V226 M510,214 V226 M660,214 V226"/>
  <text class="kp-note" x="56" y="244">0</text>
  <text class="kp-note" x="200" y="244">0.5</text>
  <text class="kp-note" x="350" y="244">1.0</text>
  <text class="kp-note" x="500" y="244">1.5</text>
  <text class="kp-note" x="650" y="244">2.0</text>
  <!-- When it is due -->
  <g data-on="1 2 3">
    <path class="kp-due" d="M210,100 V214"/>
    <text class="kp-label" x="216" y="112">due</text>
  </g>
  <g data-on="3 4">
    <path class="kp-due" d="M360,100 V214"/>
    <text class="kp-label" x="366" y="112">next due</text>
  </g>
  <g data-on="4">
    <path class="kp-due" d="M660,100 V214"/>
    <text class="kp-label" x="666" y="112">then due</text>
  </g>
  <!-- The turns -->
  <g data-on="2 3 4">
    <path class="kp-turn" d="M150,180 V220"/>
    <text class="kp-label" x="132" y="172">turn</text>
  </g>
  <g data-on="3 4">
    <path class="kp-turn" d="M240,180 V220"/>
    <rect class="kp-chip" x="218" y="140" width="46" height="20" rx="10"/>
    <text class="kp-chip-text" x="227" y="154">fires</text>
    <path class="kp-over" d="M210,200 H240"/>
    <text class="kp-note" x="196" y="268">0.1 over, carried</text>
  </g>
  <g data-on="4">
    <path class="kp-turn" d="M540,180 V220"/>
    <path class="kp-turn" d="M555,180 V220"/>
    <rect class="kp-chip" x="500" y="140" width="46" height="20" rx="10"/>
    <text class="kp-chip-text" x="509" y="154">fires</text>
    <rect class="kp-chip" x="552" y="140" width="46" height="20" rx="10"/>
    <text class="kp-chip-text" x="561" y="154">fires</text>
    <text class="kp-note" x="440" y="268">sat out, then one a turn</text>
  </g>
</svg>
