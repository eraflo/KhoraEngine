[package]
name = "khora-agents"
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Intelligent wrappers driving the Lanes"

[dependencies]
khora-core = { path = "../khora-core" }
khora-data = { path = "../khora-data" }
khora-lanes = { path = "../khora-lanes" }
khora-script = { path = "../khora-script" }
khora-telemetry = { path = "../khora-telemetry" }

bytemuck = { version = "1.25.0", features = ["derive"] }
crossbeam-channel = "0.5"
log = "0.4"

# Error handling
anyhow = "1.0"

# Image handling
image = "0.25.9"

tempfile = "3.25.0"
bincode = { version = "2.0.1", features = ["serde"] }

[dev-dependencies]
khora-control = { path = "../khora-control" }
khora-io = { path = "../khora-io" }
khora-infra = { path = "../khora-infra", features = ["physics"] }
