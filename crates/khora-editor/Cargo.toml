[package]
name = "khora-editor"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "The Khora Engine editor GUI"

[[bin]]
name = "khora-editor"
path = "src/main.rs"

[dependencies]
# Runtime (engine + egui backend seam).
khora-sdk = { path = "../khora-sdk" }
# Look (brand palette + shared widgets). Separate from the SDK so games don't
# inherit Khora's tool brand; the editor is a tool, so it takes both.
khora-tool-ui = { path = "../khora-tool-ui" }
inventory = "0.3"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
rfd = "0.17"
open = "5"
# Move deleted assets to the OS recycle bin (reversible) instead of hard-deleting.
trash = "5"
# Enumerate real directories under assets/ so empty folders are browsable.
walkdir = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12.0"
image = { version = "0.25", default-features = false, features = ["png"] }
