# cargo-deny configuration for KhoraEngine.
# Schema: cargo-deny 0.18+/0.19+ (the version bundled by
# EmbarkStudios/cargo-deny-action@v2). See:
# https://embarkstudios.github.io/cargo-deny/
#
# Intent: a supply-chain / license gate that is green on the current
# dependency tree without silently hiding real problems. Security
# advisories (vulnerabilities) FAIL the build; pre-existing duplicate
# dependency versions only WARN so the gate doesn't break on day one.

[graph]
# Evaluate the dependency graph for all targets so a vuln gated behind a
# platform-specific dep can't slip through.
all-features = true

[advisories]
# RustSec advisory database. Yanked crates and unmaintained advisories
# warn (informational, don't break CI); actual vulnerabilities are denied
# by cargo-deny's defaults and surface as errors. Add specific advisory
# IDs to `ignore` ONLY with a documented justification — never to mask a
# live vulnerability.
yanked = "warn"
# `unmaintained` is deliberately absent. The key's meaning has changed twice
# across cargo-deny releases — it was removed in 0.17, reintroduced in 0.18
# with new values — and the action bundles a version where setting it fails
# config validation outright, before any dependency is even examined. Leaving
# it to the tool's default keeps this file valid across versions; specific
# advisories are silenced by ID in `ignore` below, which every version honours.
ignore = [
    # RUSTSEC-2025-0141 — bincode 2.x is flagged unmaintained (the maintainer
    # stepped back). This is an UNMAINTAINED notice, not a security
    # vulnerability, and the advisory itself states no safe upgrade exists.
    # We acknowledge it here rather than fail CI on an informational notice.
    # Revisit if a maintained successor or a real vulnerability appears.
    "RUSTSEC-2025-0141",

    # The entries below are all transitive dependencies this workspace does not
    # choose and cannot upgrade on its own — each was checked with
    # `cargo tree --target all -i <crate>` and kept only because the vulnerable
    # code is not reachable from any input an attacker controls. Re-check when
    # winit or image bump their own trees.

    # RUSTSEC-2026-0194 / -0195 — quick-xml DoS (quadratic attribute scan,
    # unbounded namespace allocation). Fixed in 0.41, but quick-xml is pinned
    # here by `wayland-scanner`, a PROC MACRO: it parses the Wayland protocol
    # XML shipped inside the crate at BUILD time, on Linux only. There is no
    # runtime XML path and no attacker-supplied document, so neither denial of
    # service is reachable. Drop these once winit's Wayland stack moves to 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # RUSTSEC-2024-0436 — `paste` is unmaintained, with no successor. Another
    # proc macro, reached through image -> ravif -> rav1e, so it runs at build
    # time and ships no code in the binary.
    "RUSTSEC-2024-0436",

    # RUSTSEC-2026-0192 — `ttf-parser` is unmaintained, no safe upgrade. Comes
    # in through winit -> sctk-adwaita, which draws client-side window
    # decorations on Linux/Wayland. An unmaintained notice, not a vulnerability.
    "RUSTSEC-2026-0192",
]

[licenses]
# Permissive licenses accepted across the dependency tree. A dependency
# under any other license fails the check (cargo-deny denies unlisted
# licenses by default in this schema).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Encountered in the current dependency tree, all OSI/permissive:
    "BSL-1.0",              # clipboard-win, error-code (Boost Software License)
    "NCSA",                 # libfuzzer-sys (University of Illinois/NCSA, BSD-like)
    "CDLA-Permissive-2.0",  # webpki-roots (Community Data License, permissive)
    "OFL-1.1",              # epaint_default_fonts (SIL Open Font License)
    "Ubuntu-font-1.0",      # epaint_default_fonts (Ubuntu Font License)
    # libbz2-rs-sys, reached through zip -> bzip2. The bzip2 license is a
    # BSD-style permissive license (no copyleft, no advertising clause), so it
    # sits with the rest of this list rather than being an exception to it.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
# Lenient on purpose: the tree already carries duplicate versions of some
# transitive crates. Warn (don't fail) so the gate is actionable without
# blocking unrelated work. Wildcard version requirements in first-party
# manifests are still denied.
multiple-versions = "warn"
# First-party workspace crates depend on each other through `path = "..."`,
# which Cargo records as a `*` version requirement. cargo-deny's
# `allow-wildcard-paths` only exempts crates marked `publish = false`, and
# these crates are publishable, so it doesn't apply here. The wildcards are
# all internal path deps (no external crate is pinned to `*`), so we allow
# them rather than mark every first-party crate unpublishable.
wildcards = "allow"
allow = []
deny = []

[sources]
# Only crates.io (and any explicitly allowed git sources) are trusted.
unknown-registry = "deny"
unknown-git = "warn"
