# Machine-readable index for the gamedev profile (building games with the SDK).
profile: gamedev
description: AI documentation for developing games WITH the Khora Engine (khora-sdk only).

docs:
  - { path: SOUL.md,            load: always,    tags: [identity, orchestrator, sdk-map, routing] }
  - { path: RULES.md,           load: always,    tags: [rules, constraints, sdk-only, boundaries] }
  - { path: index.md,           load: always,    tags: [index, navigation] }
  - { path: sdk-guide.md,       load: on_demand, tags: [sdk, api, vessel, engineapp, input, scene] }
  - { path: conventions.md,     load: on_demand, tags: [style, game-structure, patterns] }
  - { path: security-privacy.md, load: on_demand, tags: [security, privacy, secrets, builds] }

knowledge:
  - { path: knowledge/context.md, load: on_demand, tags: [project, sdk-surface, commands] }
  - { path: knowledge/MEMORY.md,  load: on_demand, tags: [game-state, notes] }

agents:
  - { path: agents/orchestrator.md,        when: default front door / routing }
  - { path: agents/gameplay-expert.md,     when: entities, EngineApp loop, input, components }
  - { path: agents/scene-design-expert.md, when: scene setup, spawning, lighting, game UI (uses /impeccable) }
  - { path: agents/security-auditor.md,    when: no secrets in builds, safe SDK usage }

skills:
  - { path: skills/start-a-game/SKILL.md,   when: scaffold a new game on the SDK }
  - { path: skills/spawn-entity/SKILL.md,   when: spawn entities via Vessel }
  - { path: skills/setup-input/SKILL.md,    when: bind input actions }
  - { path: skills/load-scene/SKILL.md,     when: load/serialize a scene }
  - { path: skills/pack-and-ship/SKILL.md,  when: build + pack + ship a game }

hooks:
  - { path: hooks/doc-change.md,  event: on AI-doc change → reinstall wrappers }
  - { path: hooks/bootstrap.md,   event: session start }
  - { path: hooks/teardown.md,    event: session end }
  - { path: hooks/secret-scan.md, event: pre-commit secret scan }
