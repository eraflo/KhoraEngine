name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write # allowed to push to the repository (tags, releases, commits)
  issues: write # allowed to comment on released issues
  pull-requests: write # allowed to comment on released PRs

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for semantic-release to analyze history

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
          extra_plugins: |
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request for release changes
        if: success()
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore(release): update changelog'
          branch: release-changes
          title: 'Release: Update Changelog'
          body: 'Automated release PR with CHANGELOG.md updates.'
          base: main

  build:
    name: Build Binaries (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            engine_archive: khora-engine-windows-x86_64.zip
            hub_archive: khora-hub-windows-x86_64.zip
            runtime_archive: khora-runtime-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            engine_archive: khora-engine-linux-x86_64.tar.gz
            hub_archive: khora-hub-linux-x86_64.tar.gz
            runtime_archive: khora-runtime-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            engine_archive: khora-engine-macos-aarch64.tar.gz
            hub_archive: khora-hub-macos-aarch64.tar.gz
            runtime_archive: khora-runtime-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libssl-dev \
            pkg-config

      - name: Build engine binary
        run: cargo build --release -p khora-editor

      # The hub bakes its GitHub OAuth Client ID into the binary at compile
      # time from KHORA_HUB_GITHUB_CLIENT_ID. The build fails (by design) if
      # the secret is missing — never ship a release without it.
      - name: Build hub binary
        env:
          KHORA_HUB_GITHUB_CLIENT_ID: ${{ secrets.KHORA_HUB_GITHUB_CLIENT_ID }}
        run: cargo build --release -p khora-hub

      # khora-runtime is the generic player binary the editor's "Build Game"
      # feature stamps with each project's packed assets. It ships per
      # target so the editor can produce cross-platform builds without
      # cross-compiling the user's project locally.
      - name: Build runtime binary
        run: cargo build --release -p khora-runtime

      # ── Stage engine payload (binary + font licenses) ──────────────
      # The brand fonts and the logo are embedded in the editor and hub
      # binaries by khora-tool-ui; only their SIL OFL licenses ship next to
      # them, as the fonts' license requires.
      - name: Stage engine payload (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/engine/licenses | Out-Null
          Copy-Item target/release/khora-editor.exe stage/engine/
          Copy-Item crates/khora-tool-ui/assets/fonts/LICENSE-*.txt stage/engine/licenses/

      - name: Stage engine payload (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p stage/engine/licenses
          cp target/release/khora-editor stage/engine/
          cp crates/khora-tool-ui/assets/fonts/LICENSE-*.txt stage/engine/licenses/

      # ── Stage hub payload (binary + font licenses) ─────────────────
      - name: Stage hub payload (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/hub/licenses | Out-Null
          Copy-Item target/release/khora-hub.exe stage/hub/
          Copy-Item crates/khora-tool-ui/assets/fonts/LICENSE-*.txt stage/hub/licenses/

      - name: Stage hub payload (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p stage/hub/licenses
          cp target/release/khora-hub stage/hub/
          cp crates/khora-tool-ui/assets/fonts/LICENSE-*.txt stage/hub/licenses/

      # ── Stage runtime payload (binary only) ───────────────────────
      # Runtime ships as a single binary — its asset payload (index.bin +
      # data.pack + runtime.json) is supplied by the editor's Build Game
      # feature on a per-project basis, NOT by the engine release.
      - name: Stage runtime payload (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/runtime | Out-Null
          Copy-Item target/release/khora-runtime.exe stage/runtime/

      - name: Stage runtime payload (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p stage/runtime
          cp target/release/khora-runtime stage/runtime/

      # ── Package archives ───────────────────────────────────────────
      - name: Package archives (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path stage/engine/*  -DestinationPath ${{ matrix.engine_archive }}
          Compress-Archive -Path stage/hub/*     -DestinationPath ${{ matrix.hub_archive }}
          Compress-Archive -Path stage/runtime/* -DestinationPath ${{ matrix.runtime_archive }}

      - name: Package archives (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar czf ${{ matrix.engine_archive }}  -C stage/engine  .
          tar czf ${{ matrix.hub_archive }}     -C stage/hub     .
          tar czf ${{ matrix.runtime_archive }} -C stage/runtime .

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: |
            ${{ matrix.engine_archive }}
            ${{ matrix.hub_archive }}
            ${{ matrix.runtime_archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
