[alias]
xtask = "run --package xtask --"
# The gate CI runs (format, clippy, tests, doc tests), stopping at the first
# failure: `cargo gate`. Run it once, when a change is done.
gate = "xtask gate"
# Targeted tests while iterating: `cargo t -p <crate> [filter]`. Scoped to one
# crate, a run after a change relinks only that crate's test binaries; a
# workspace-wide run would relink every crate depending on it. Always with
# `--all-features`, so each crate keeps a single cached build.
t = "nextest run --all-features"
sandbox = "run -p sandbox"

# `cargo hub-dev` — pre-build editor + runtime in debug, then run the hub
# in release. The typical contributor's dev loop in one command. See
# `xtask/src/commands/dev.rs` for what each step does.
hub-dev = "xtask hub-dev"

# Link with `rust-lld`, which ships with the Rust toolchain, instead of MSVC's
# link.exe. A workspace test run links some forty test binaries, each pulling
# in wgpu, rapier and egui; link time dominates a rebuild after a small change.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

