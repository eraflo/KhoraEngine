[package]
name = "khora-script"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Ergon — the Khora scripting language: compiler and interruptible virtual machine"

[dependencies]
# Engine-side types only: `math`, `EntityId`, and the script command vocabulary.
# This crate still knows nothing about the ECS, agents or lanes — the language
# is designed to be testable without an engine.
khora-core = { path = "../khora-core" }

# The suspended state of the VM has to survive a frame boundary and a scene
# save, so it is serialisable from the very first prototype rather than
# retrofitted later.
serde = { version = "1.0", features = ["derive"] }

# The built-in `Log` reports through the engine's own sink, so a script's output
# lands wherever the rest of the engine's does.
log = "0.4"

# Engine functions register themselves next to their definition, the same way
# components and flows already do.
inventory = "0.3"
khora-macros = { path = "../khora-macros" }

[dev-dependencies]
serde_json = "1.0"
