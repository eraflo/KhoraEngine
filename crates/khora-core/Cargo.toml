[package]
name = "khora-core"
version = "0.2.2"
edition = "2021"
description = "Foundational crate with traits, core types, and interface contracts"

[features]
default = []
serde = []

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }

# Math and approximation
approx = "0.5"

# Portable, stable-Rust explicit SIMD for the batched transform kernels
# (the AGDF compute-heavy "hot loop" lever). `f32x8` maps 1:1 to an 8-wide
# AoSoA tile; see `math::simd`.
wide = "0.7"

# Error handling
anyhow = "1.0"

# Async support
async-trait = "0.1"
tokio.workspace = true

# Serialization
bincode = { version = "2.0.1", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4", "v5", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Communication
flume = "0.12"

# Logging
log = "0.4"

# Handle
raw-window-handle = "0.6"
