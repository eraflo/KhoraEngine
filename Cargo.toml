[workspace]
resolver = "2" # Recommended for modern Rust
members = [
    # New modular architecture
    "crates/khora-core",
    "crates/khora-control",
    "crates/khora-data",
    "crates/khora-io",
    "crates/khora-lanes",
    "crates/khora-agents",
    "crates/khora-infra",
    "crates/khora-telemetry",
    # Ergon — the scripting language. Depends only on khora-core (math), so the
    # compiler and VM stay testable without booting an engine.
    "crates/khora-script",
    "crates/khora-editor",
    "crates/khora-hub",
    "crates/khora-runtime",
    "crates/khora-sdk",
    # First-party tool design system (brand + widgets). Not an engine crate:
    # khora-sdk does not depend on it, so games never compile Khora's brand.
    "crates/khora-tool-ui",
    # Examples and tools
    "examples/sandbox",
    "workspace-hack",
    "xtask",
]

# Shared package metadata inherited by every workspace member via
# `rust-version.workspace = true`. The MSRV is pinned to 1.95 — the lowest
# stable toolchain that actually compiles the whole workspace, verified by
# `cargo +1.95 check --workspace --all-features --all-targets`. The binding
# constraints are:
#   * dependency floor: sysinfo 0.39 requires >= 1.95 — this is the one that
#     sets the number, and it applies to every 0.39.x including 0.39.1;
#   * dependency floor: the egui/eframe 0.34 family requires >= 1.92;
#   * `const fn TypeId::of` used in `const` context by the `#[derive(Component)]`
#     output in khora-data (stabilized as const in Rust 1.91);
#   * first-party `{integer}::is_multiple_of` (1.87) and `Option::is_none_or`
#     (1.82) sit well below this floor.
#
# The floor is set by dependencies, not by anything first-party, so it can drop
# again if those crates relax their own. Keep the `MSRV` CI job's toolchain in
# step with this value — the two are checked against each other by nothing else.
[workspace.package]
rust-version = "1.95"
# The whole workspace ships under Apache-2.0 (see ./LICENSE). Declaring it
# here and inheriting it per crate makes every manifest self-describe its
# license, which the cargo-deny licenses check enforces.
license = "Apache-2.0"


[profile.dev]
# Workspace crates are rebuilt on every change: compile them without
# optimisation. Dependencies are built once and cached, so they get optimised
# (below) — wgpu, rapier and the rest stay fast at run time.
opt-level = 0
# No debuginfo in dev builds, the tests' included (`cargo test` builds every
# crate but the test executable itself with this profile). The workspace
# links some fifty binaries, each with the whole engine: on Windows each link
# wrote a PDB of over 100 MB, gigabytes in all, and writing them was a large
# part of every link. A panic still names its file and line — `Location` is
# compiled in, not read from debuginfo; a backtrace names its functions, not
# their lines. To step through code in a debugger, or get lines in a
# backtrace, build with `CARGO_PROFILE_DEV_DEBUG=line-tables-only` (or `2`):
# the workspace's crates then carry it, the dependencies stay without.
debug = 0
[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.release]
lto = true      # Link-Time Optimization for release
codegen-units = 1 # Maximize optimizations (compiles slower)

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
