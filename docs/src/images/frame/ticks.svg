<svg id="fig-frame-ticks" class="kp-figure" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kp-frame-ticks-title kp-frame-ticks-desc">
  <title id="kp-frame-ticks-title">Fixed ticks, physics steps and the render alpha</title>
  <desc id="kp-frame-ticks-desc">A slow frame of 40 milliseconds, after a frame that left 5 milliseconds carried. The 40 milliseconds are under the 250 millisecond clamp and the scale is 1, so the accumulator holds 45 milliseconds. It holds 2 whole game ticks of 16.7 milliseconds; the rest, 11.7 milliseconds, is carried to the next frame, and the render alpha is 0.70. Physics, at a step of 8.3 milliseconds, gets exactly the 33.3 milliseconds the ticks advanced: 4 steps. FixedUpdate runs twice, once per tick. The frame renders once, blending the previous and current poses by 0.70.</desc>
  <style>
    #fig-frame-ticks { width: 100%; height: auto; display: block; margin: 0; }
    #fig-frame-ticks .kp-bg { fill: var(--k-bg-0, #090d17); }
    #fig-frame-ticks .kp-axis { stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-frame-ticks .kp-carry { fill: var(--k-bg-2, #181e2b); stroke: var(--k-silver-dim, #809db2); stroke-width: 1; stroke-dasharray: 3 3; }
    #fig-frame-ticks .kp-span { fill: var(--k-bg-3, #1f2636); stroke: var(--k-silver-dim, #809db2); stroke-width: 1; }
    #fig-frame-ticks .kp-tick { fill: var(--k-bg-3, #1f2636); stroke: var(--k-silver, #b4cfe2); stroke-width: 1.2; }
    #fig-frame-ticks .kp-rest { fill: none; stroke: var(--k-gold, #e4b65c); stroke-width: 1.8; stroke-dasharray: 5 3; }
    #fig-frame-ticks .kp-step { fill: var(--k-bg-2, #181e2b); stroke: var(--k-silver-dim, #809db2); stroke-width: 1; }
    #fig-frame-ticks .kp-render { fill: none; stroke: var(--k-gold, #e4b65c); stroke-width: 2; }
    #fig-frame-ticks .kp-head { fill: var(--k-silver, #b4cfe2); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 12px; font-weight: 500; }
    #fig-frame-ticks .kp-station { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-display, 'Archivo', Georgia, serif); font-style: italic; font-size: 12px; }
    #fig-frame-ticks .kp-name { fill: var(--k-fg-1, #bfc5ca); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 10.5px; }
    #fig-frame-ticks .kp-num { fill: var(--k-fg-3, #5d646c); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 10px; }
    #fig-frame-ticks .kp-gold { fill: var(--k-gold, #e4b65c); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 11.5px; }
    #fig-frame-ticks .kp-how { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 12px; }
  </style>
  <rect class="kp-bg" x="0" y="0" width="760" height="340" rx="10"/>
  <text class="kp-head" x="70" y="28">10 px per millisecond</text>
  <!-- axis -->
  <line class="kp-axis" x1="70" y1="40" x2="70" y2="236"/>
  <line class="kp-axis" x1="236.7" y1="40" x2="236.7" y2="236"/>
  <line class="kp-axis" x1="403.3" y1="40" x2="403.3" y2="236"/>
  <text class="kp-num" x="66" y="252">0</text>
  <text class="kp-num" x="222" y="252">16.7</text>
  <text class="kp-num" x="389" y="252">33.3</text>
  <text class="kp-num" x="508" y="252">45 ms</text>
  <!-- row labels -->
  <text class="kp-station" x="610" y="66">accumulator</text>
  <text class="kp-station" x="610" y="112">game ticks</text>
  <text class="kp-station" x="610" y="158">physics steps</text>
  <text class="kp-station" x="610" y="204">render</text>
  <!-- 1. the accumulator -->
  <rect class="kp-carry" x="70" y="50" width="50" height="26" rx="3"/>
  <text class="kp-name" x="76" y="67">5</text>
  <g data-on="1 2 3 4 5">
    <rect class="kp-span" x="120" y="50" width="400" height="26" rx="3"/>
    <text class="kp-name" x="132" y="67">this frame: 40 ms × scale 1</text>
  </g>
  <g data-on="1">
    <text class="kp-how" x="20" y="282">The frame took 40 ms of real time: under the 250 ms clamp, times a scale of 1. It is</text>
    <text class="kp-how" x="20" y="300">added to the 5 ms the last frame carried: the accumulator holds 45 ms.</text>
  </g>
  <!-- 2. whole ticks -->
  <g data-on="2 3 4 5">
    <rect class="kp-tick" x="70" y="96" width="166.7" height="26" rx="3"/>
    <text class="kp-name" x="80" y="113">tick 1</text>
    <rect class="kp-tick" x="236.7" y="96" width="166.6" height="26" rx="3"/>
    <text class="kp-name" x="246" y="113">tick 2</text>
  </g>
  <g data-on="2">
    <text class="kp-how" x="20" y="282">45 ms holds 2 whole game ticks of 1/60 s. A frame takes at most 5; past them the time</text>
    <text class="kp-how" x="20" y="300">is dropped, so a long stall slows the game instead of piling up work.</text>
  </g>
  <!-- 3. the rest -->
  <g data-on="3 4 5">
    <rect class="kp-rest" x="403.3" y="96" width="116.7" height="26" rx="3"/>
    <text class="kp-gold" x="412" y="113">11.7 carried</text>
  </g>
  <g data-on="3">
    <text class="kp-how" x="20" y="282">The rest, 11.7 ms, is carried to the next frame. As a share of a tick it is the</text>
    <text class="kp-how" x="20" y="300">render alpha: 11.7 / 16.7 = 0.70, always in [0, 1).</text>
  </g>
  <!-- 4. physics -->
  <g data-on="4 5">
    <rect class="kp-step" x="70" y="142" width="83.3" height="26" rx="3"/>
    <rect class="kp-step" x="153.3" y="142" width="83.4" height="26" rx="3"/>
    <rect class="kp-step" x="236.7" y="142" width="83.3" height="26" rx="3"/>
    <rect class="kp-step" x="320" y="142" width="83.3" height="26" rx="3"/>
    <text class="kp-name" x="80" y="159">8.3</text>
    <text class="kp-name" x="163" y="159">8.3</text>
    <text class="kp-name" x="246" y="159">8.3</text>
    <text class="kp-name" x="330" y="159">8.3</text>
  </g>
  <g data-on="4">
    <text class="kp-how" x="20" y="282">Physics gets exactly the 33.3 ms the ticks advanced, cut at its own step, here 1/120 s:</text>
    <text class="kp-how" x="20" y="300">4 steps. A script's FixedUpdate runs twice, once per tick, whatever the physics step.</text>
  </g>
  <!-- 5. render -->
  <g data-on="5">
    <rect class="kp-render" x="70" y="188" width="450" height="26" rx="3"/>
    <text class="kp-gold" x="80" y="205">once, blending the last two poses by 0.70</text>
    <text class="kp-how" x="20" y="282">The frame renders once. Each body is drawn between its previous and its current</text>
    <text class="kp-how" x="20" y="300">pose, 70 % of the way, so motion stays smooth at any refresh rate.</text>
  </g>
</svg>
