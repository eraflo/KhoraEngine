<svg id="fig-scripting-named-arguments" class="kp-figure" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kp-named-title kp-named-desc">
  <title id="kp-named-title">A call with named arguments, evaluated as written and placed as declared</title>
  <desc id="kp-named-desc">The call Pair(b: Two(), a: Three()) to a function declared Pair(int a, int b). First, the written arguments run in the order written — Two() then Three() — each into a register of its own. Then each value moves into its parameter's slot in the order the function declares them: Three's value into a, Two's into b. A turn stopped between the two calls holds Two's value in its own register, whatever order the parameters have, so an edit that reorders them cannot swap the values.</desc>
  <style>
    #fig-scripting-named-arguments { width: 100%; height: auto; display: block; margin: 1.5rem 0; }
    #fig-scripting-named-arguments .kp-bg { fill: var(--k-bg-0, #090d17); }
    #fig-scripting-named-arguments .kp-row { fill: var(--k-bg-1, #101622); }
    #fig-scripting-named-arguments .kp-reg { fill: var(--k-bg-2, #181e2b); stroke: var(--k-line, #383d48); stroke-width: 1; }
    #fig-scripting-named-arguments .kp-slot { fill: var(--k-bg-2, #181e2b); stroke: var(--k-silver-dim, #809db2); stroke-width: 1; }
    #fig-scripting-named-arguments .kp-flow { fill: none; stroke: var(--k-fg-3, #5d646c); stroke-width: 1.25; }
    #fig-scripting-named-arguments .kp-stop { fill: none; stroke: var(--k-gold, #e4b65c); stroke-width: 1.5; stroke-dasharray: 4 3; }
    #fig-scripting-named-arguments .kp-station { fill: var(--k-fg-0, #eff2f5); font-family: var(--k-font-display, 'Archivo', Georgia, serif); font-style: italic; font-size: 16px; }
    #fig-scripting-named-arguments .kp-head { fill: var(--k-silver, #b4cfe2); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 11.5px; font-weight: 500; }
    #fig-scripting-named-arguments .kp-label { fill: var(--k-fg-2, #8a9096); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 11.5px; }
    #fig-scripting-named-arguments .kp-code { fill: var(--k-fg-1, #bfc5ca); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 12px; }
    #fig-scripting-named-arguments .kp-note { fill: var(--k-fg-3, #5d646c); font-family: var(--k-font-mono, 'IBM Plex Mono', ui-monospace, monospace); font-size: 10.5px; }
    #fig-scripting-named-arguments .kp-gold { fill: var(--k-gold, #e4b65c); font-family: var(--k-font-sans, 'Archivo', system-ui, sans-serif); font-size: 11px; }
  </style>
  <defs>
    <marker id="kp-named-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--k-fg-3, #5d646c)"/>
    </marker>
  </defs>
  <rect class="kp-bg" x="0" y="0" width="760" height="300" rx="8"/>
  <text class="kp-code" x="32" y="36">fn int Pair(int a, int b) { … }</text>
  <text class="kp-code" x="32" y="58">Pair(b: Two(), a: Three());</text>
  <!-- 1. evaluated as written -->
  <rect class="kp-row" x="24" y="78" width="712" height="88" rx="4"/>
  <text class="kp-station" x="40" y="104">evaluated as written</text>
  <text class="kp-label" x="40" y="124">each into a register of its own,</text>
  <text class="kp-label" x="40" y="140">side effects in source order</text>
  <rect class="kp-reg" x="300" y="98" width="150" height="44" rx="4"/>
  <text class="kp-code" x="314" y="118">Two()</text>
  <text class="kp-note" x="314" y="134">held · 1st</text>
  <rect class="kp-reg" x="520" y="98" width="150" height="44" rx="4"/>
  <text class="kp-code" x="534" y="118">Three()</text>
  <text class="kp-note" x="534" y="134">held · 2nd</text>
  <path class="kp-flow" d="M450,120 H516" marker-end="url(#kp-named-arrow)"/>
  <!-- a stop between the two -->
  <path class="kp-stop" d="M485,98 V146"/>
  <text class="kp-gold" x="485" y="92" text-anchor="middle">a turn may stop here</text>
  <!-- 2. placed as declared -->
  <rect class="kp-row" x="24" y="182" width="712" height="88" rx="4"/>
  <text class="kp-station" x="40" y="208">placed as declared</text>
  <text class="kp-label" x="40" y="228">moved into the parameters, in</text>
  <text class="kp-label" x="40" y="244">the order the callee names them</text>
  <rect class="kp-slot" x="300" y="202" width="150" height="44" rx="4"/>
  <text class="kp-code" x="314" y="222">a ← Three()</text>
  <text class="kp-note" x="314" y="238">parameter 1</text>
  <rect class="kp-slot" x="520" y="202" width="150" height="44" rx="4"/>
  <text class="kp-code" x="534" y="222">b ← Two()</text>
  <text class="kp-note" x="534" y="238">parameter 2</text>
  <path class="kp-flow" d="M375,142 C375,172 595,172 595,198" marker-end="url(#kp-named-arrow)"/>
  <path class="kp-flow" d="M595,142 C595,176 375,168 375,198" marker-end="url(#kp-named-arrow)"/>
</svg>
